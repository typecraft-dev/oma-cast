[package]
name = "oma-cast-files"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "File search sidecar for oma-cast, backed by fff-search"

[dependencies]
fff-search = "=0.11.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
